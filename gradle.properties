# Project-wide Gradle settings.
# Give R8 enough heap for release minification on a 16 GB machine. Keep the
# Kotlin daemon smaller and limit concurrent workers to avoid native OOM.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2048m -XX:+UseG1GC
kotlin.code.style=official

# Giới hạn worker JVM song song để tránh cạn kiệt RAM vật lý khi build sạch.
org.gradle.workers.max=2

android.enableJetifier=false
android.disallowKotlinSourceSets=false
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE

