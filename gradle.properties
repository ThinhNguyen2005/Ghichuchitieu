# Project-wide Gradle settings.
# Heap sizes are tuned for a 16 GB dev machine: Gradle daemon + Kotlin daemon
# together must stay well under physical RAM, otherwise the JVM dies on native
# malloc (hs_err_pid*.log: "insufficient memory ... Chunk::new"), not on heap OOM.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2048m -XX:+UseG1GC
kotlin.code.style=official

# Giới hạn worker JVM song song để tránh cạn kiệt RAM vật lý khi build sạch.
org.gradle.workers.max=4

android.enableJetifier=false
android.disallowKotlinSourceSets=false
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE

