name: Android Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify, Build and Publish Signed Releases
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v6

      - name: Grant Gradle wrapper permission
        run: chmod +x gradlew

      - name: Configure CI JVM Memory
        shell: bash
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties
          echo "kotlin.daemon.jvmargs=-Xmx2048m -XX:+UseG1GC" >> ~/.gradle/gradle.properties

      - name: Validate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must use stable semantic-version format such as v1.1.0."
            exit 1
          fi

          version_name="${RELEASE_TAG#v}"
          IFS='.' read -r major minor patch <<< "$version_name"
          if (( ${#major} > 4 )); then
            echo "Release major version is too large for Android versionCode."
            exit 1
          fi
          major_number=$((10#$major))
          minor_number=$((10#$minor))
          patch_number=$((10#$patch))
          if (( minor_number >= 1000 || patch_number >= 1000 )); then
            echo "Release minor and patch versions must be less than 1000."
            exit 1
          fi
          version_code=$((major_number * 1000000 + minor_number * 1000 + patch_number))
          if (( version_code < 1 || version_code > 2100000000 )); then
            echo "Derived Android versionCode is outside the supported range."
            exit 1
          fi

          {
            printf 'NOTEPAY_VERSION_NAME=%s\n' "$version_name"
            printf 'NOTEPAY_VERSION_CODE=%s\n' "$version_code"
            printf 'RELEASE_VERSION_NAME=%s\n' "$version_name"
            printf 'RELEASE_VERSION_CODE=%s\n' "$version_code"
          } >> "$GITHUB_ENV"
          echo "Release version $version_name resolved to Android versionCode $version_code."

      - name: Validate signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_NOTEPAY_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_NOTEPAY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEYSTORE_NOTEPAY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_NOTEPAY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$KEYSTORE_BASE64" ]] || missing+=(KEYSTORE_NOTEPAY_BASE64)
          [[ -n "$KEYSTORE_PASSWORD" ]] || missing+=(KEYSTORE_NOTEPAY_PASSWORD)
          [[ -n "$KEY_ALIAS" ]] || missing+=(KEYSTORE_NOTEPAY_ALIAS)
          [[ -n "$KEY_PASSWORD" ]] || missing+=(KEYSTORE_NOTEPAY_KEY_PASSWORD)

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required GitHub secret(s): %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Prepare release signing files
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_NOTEPAY_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_NOTEPAY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEYSTORE_NOTEPAY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_NOTEPAY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          test -s app/release.keystore
          {
            printf 'storeFile=release.keystore\n'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > app/signing.properties

      - name: Run Quality Gate (Detekt & Flavor Unit Tests)
        run: ./gradlew detekt :app:testFullDebugUnitTest :app:testPlayDebugUnitTest --stacktrace

      - name: Build Signed Release Artifacts (Full APK, Play APK & Play AAB)
        run: ./gradlew :app:assembleFullRelease :app:assemblePlayRelease :app:bundlePlayRelease --stacktrace

      - name: Verify APK/AAB Metadata & Outputs
        shell: bash
        run: |
          set -euo pipefail
          android_home="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$android_home" || ! -d "$android_home" ]]; then
            echo "Android SDK location is unavailable; refusing to publish unverified release metadata."
            exit 1
          fi
          aapt_path="$(find "$android_home/build-tools" -type f -name aapt -print 2>/dev/null | sort -V | tail -n 1)"
          if [[ -z "$aapt_path" ]]; then
            echo "aapt was not found; refusing to publish unverified release metadata."
            exit 1
          fi

          play_apk="app/build/outputs/apk/play/release/app-play-release.apk"
          full_apk="app/build/outputs/apk/full/release/app-full-release.apk"
          play_aab="app/build/outputs/bundle/playRelease/app-play-release.aab"
          full_mapping="app/build/outputs/mapping/fullRelease/mapping.txt"
          play_mapping="app/build/outputs/mapping/playRelease/mapping.txt"

          for artifact in "$play_apk" "$full_apk" "$play_aab" "$full_mapping" "$play_mapping"; do
            test -s "$artifact"
          done

          expected_play="versionCode='${RELEASE_VERSION_CODE}' versionName='${RELEASE_VERSION_NAME}'"
          expected_full="versionCode='${RELEASE_VERSION_CODE}' versionName='${RELEASE_VERSION_NAME}-full'"

          play_badging="$($aapt_path dump badging "$play_apk")"
          full_badging="$($aapt_path dump badging "$full_apk")"
          if ! printf '%s\n' "$play_badging" | grep -Fq "$expected_play"; then
            echo "Play APK metadata does not match the release tag."
            exit 1
          fi
          if ! printf '%s\n' "$full_badging" | grep -Fq "$expected_full"; then
            echo "Full APK metadata does not match the release tag."
            exit 1
          fi
          echo "Play APK/AAB metadata verified: versionName=$RELEASE_VERSION_NAME versionCode=$RELEASE_VERSION_CODE."
          echo "Full APK metadata verified: versionName=$RELEASE_VERSION_NAME-full versionCode=$RELEASE_VERSION_CODE."

      - name: Verify APK Signatures
        shell: bash
        run: |
          set -euo pipefail
          apk_paths=(
            app/build/outputs/apk/full/release/app-full-release.apk
            app/build/outputs/apk/play/release/app-play-release.apk
          )
          android_home="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$android_home" || ! -d "$android_home" ]]; then
            echo "Android SDK location is unavailable; refusing to publish unverified APKs."
            exit 1
          fi
          apksigner_path="$(find "$android_home/build-tools" -type f -name apksigner -print 2>/dev/null | sort -V | tail -n 1)"
          if [[ -z "$apksigner_path" ]]; then
            echo "apksigner was not found; refusing to publish unverified APKs."
            exit 1
          fi
          for apk in "${apk_paths[@]}"; do
            "$apksigner_path" verify --verbose "$apk"
          done

      - name: Prepare Release Assets & R8 Mappings
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/play/release/app-play-release.apk "dist/NotePay-play-${RELEASE_TAG}.apk"
          cp app/build/outputs/apk/full/release/app-full-release.apk "dist/NotePay-full-${RELEASE_TAG}.apk"
          cp app/build/outputs/bundle/playRelease/app-play-release.aab "dist/NotePay-play-${RELEASE_TAG}.aab"
          cp app/build/outputs/mapping/fullRelease/mapping.txt "dist/mapping-full-${RELEASE_TAG}.txt"
          cp app/build/outputs/mapping/playRelease/mapping.txt "dist/mapping-play-${RELEASE_TAG}.txt"
          (
            cd dist
            sha256sum \
              "NotePay-play-${RELEASE_TAG}.apk" \
              "NotePay-full-${RELEASE_TAG}.apk" \
              "NotePay-play-${RELEASE_TAG}.aab" \
              "mapping-full-${RELEASE_TAG}.txt" \
              "mapping-play-${RELEASE_TAG}.txt" > SHA256SUMS.txt
          )

      - name: Upload Release Artifacts & Mapping Files
        uses: actions/upload-artifact@v7
        with:
          name: notepay-release-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Create Immutable GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists; refusing to overwrite an immutable release."
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "NotePay $RELEASE_TAG" \
            --verify-tag \
            --generate-notes \
            "dist/NotePay-play-${RELEASE_TAG}.apk" \
            "dist/NotePay-full-${RELEASE_TAG}.apk" \
            "dist/NotePay-play-${RELEASE_TAG}.aab" \
            "dist/mapping-full-${RELEASE_TAG}.txt" \
            "dist/mapping-play-${RELEASE_TAG}.txt" \
            dist/SHA256SUMS.txt

      - name: Remove release signing material
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f app/signing.properties app/release.keystore
