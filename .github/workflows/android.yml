name: Android CI

on:
  push:
    branches: [ main, master, dev ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.agents/**'
      - 'LICENSE'
  pull_request:
    branches: [ main, master, dev ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.agents/**'
      - 'LICENSE'

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Hygiene, Static Analysis, Unit Tests & Debug APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' && github.ref != 'refs/heads/dev' }}

      - name: Configure CI JVM Memory
        shell: bash
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties
          echo "kotlin.daemon.jvmargs=-Xmx2048m -XX:+UseG1GC" >> ~/.gradle/gradle.properties

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Repo Hygiene & Vibe-Code Guard (Fast Fail)
        shell: bash
        run: |
          set -euo pipefail

          echo "==> [1/3] Checking for 0-byte .kt/.xml files and leftover .bak or todo.md..."
          zero_files="$(find app/src -type f \( -name '*.kt' -o -name '*.xml' \) -empty)"
          if [[ -n "$zero_files" ]]; then
            echo "ERROR: Found 0-byte Kotlin/XML files:"
            printf '%s\n' "$zero_files"
            exit 1
          fi

          stray_files="$(find app/src -type f \( -name '*.bak' -o -iname 'todo.md' \))"
          if [[ -n "$stray_files" ]]; then
            echo "ERROR: Found stray .bak or todo.md files:"
            printf '%s\n' "$stray_files"
            exit 1
          fi

          echo "==> [2/3] Checking strings.xml key parity and duplicates (vi vs en)..."
          python3 - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          def parse_keys(path):
              root = ET.parse(path).getroot()
              strings, plurals = [], []
              for el in root:
                  if el.attrib.get("translatable", "true") == "false":
                      continue
                  if el.tag == "string":
                      strings.append(el.attrib["name"])
                  elif el.tag == "plurals":
                      plurals.append(el.attrib["name"])
              return strings, plurals

          def find_dups(items):
              seen, dups = set(), set()
              for item in items:
                  if item in seen:
                      dups.add(item)
                  seen.add(item)
              return sorted(dups)

          vi_str, vi_plu = parse_keys("app/src/main/res/values/strings.xml")
          en_str, en_plu = parse_keys("app/src/main/res/values-en/strings.xml")

          errors = []
          for label, items in [
              ("values/strings.xml <string> duplicates", find_dups(vi_str)),
              ("values-en/strings.xml <string> duplicates", find_dups(en_str)),
              ("values/strings.xml <plurals> duplicates", find_dups(vi_plu)),
              ("values-en/strings.xml <plurals> duplicates", find_dups(en_plu)),
              ("missing <string> keys in values-en", sorted(set(vi_str) - set(en_str))),
              ("extra <string> keys in values-en", sorted(set(en_str) - set(vi_str))),
              ("missing <plurals> keys in values-en", sorted(set(vi_plu) - set(en_plu))),
              ("extra <plurals> keys in values-en", sorted(set(en_plu) - set(vi_plu))),
          ]:
              if items:
                  errors.append(f"{label}: {items}")

          if errors:
              print("ERROR: Localization parity/uniqueness check failed:")
              for e in errors:
                  print(" -", e)
              sys.exit(1)

          print(f"OK: {len(set(vi_str))} strings and {len(set(vi_plu))} plurals synchronized.")
          PY

          echo "==> [3/3] Scanning app/src for hardcoded Google API keys..."
          if grep -rnE 'AIzaSy[A-Za-z0-9_-]{30,}' app/src/; then
            echo "ERROR: Potential hardcoded Google API key found in app/src/."
            exit 1
          fi
          if grep -rnE 'AIzaSy[A-Za-z0-9_-]{8,}' app/src/main app/src/full app/src/play; then
            echo "ERROR: Hardcoded AIzaSy key prefix found in production source sets."
            exit 1
          fi

      - name: Static Analysis (Detekt & Android Lint)
        run: ./gradlew detekt :app:lintFullDebug :app:lintPlayDebug --stacktrace

      - name: Upload Static Analysis Reports on Failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: |
            app/build/reports/detekt/
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
          retention-days: 7

      - name: Run Unit Tests (Full & Play)
        run: ./gradlew :app:testFullDebugUnitTest :app:testPlayDebugUnitTest --stacktrace

      - name: Upload Unit Test JUnit XML & HTML Reports on Failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/test-results/testFullDebugUnitTest/*.xml
            app/build/test-results/testPlayDebugUnitTest/*.xml
            app/build/reports/tests/
          retention-days: 7

      - name: Assemble Debug APKs (Full & Play)
        run: ./gradlew :app:assembleFullDebug :app:assemblePlayDebug --stacktrace

      - name: Upload Debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: notepay-debug-apks
          path: |
            app/build/outputs/apk/full/debug/app-full-debug.apk
            app/build/outputs/apk/play/debug/app-play-debug.apk
          if-no-files-found: error
          retention-days: 7
